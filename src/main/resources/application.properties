# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tb_payment?TimeZone=Europe/Kyiv
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Kyiv

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#EXECUTORS
executor.sync.threads_count=32

#WORKSPACE
workspace.sync.rate_millis=60000